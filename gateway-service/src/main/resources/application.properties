server.port=8556

spring.application.name=api-gateway-service

eureka.client.service-url.defaultZone=http://localhost:8555/eureka
eureka.client.registry-fetch-interval-seconds=5

spring.main.web-application-type=reactive

# IMPORTANT
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# GLOBAL RETRY (VERY IMPORTANT)
spring.cloud.gateway.default-filters[0]=Retry=3

# ================= ROUTES =================

# AUTHENTICATION
spring.cloud.gateway.routes[0].id=authentication-core
spring.cloud.gateway.routes[0].uri=lb://authentication-service
spring.cloud.gateway.routes[0].predicates=Path=/auth/**

# INVENTORY
spring.cloud.gateway.routes[1].id=inventory-core
spring.cloud.gateway.routes[1].uri=lb://inventory-service
spring.cloud.gateway.routes[1].predicates=Path=/inventory/**
spring.cloud.gateway.routes[1].filters=AuthenticationFilter

