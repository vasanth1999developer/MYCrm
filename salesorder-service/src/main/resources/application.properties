spring.application.name=salesorder-service
server.port=8568

#Eureka configuration
#eureka.instance.instance-id=${spring.application.name}:${random.value}
#eureka.client.serviceUrl.defaultZone = http://localhost:8555/eureka




#Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ms_mybiz_salesorder
spring.datasource.username=root
spring.datasource.password=admin
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=update
logging.level.org.hibernate.SQL=debug

spring.cloud.loadbalancer.ribbon.enabled=true

#Swagger configuration
springdoc.swagger-ui.path=/swagger-url.html
springdoc.api.docs.path=/api-docs

