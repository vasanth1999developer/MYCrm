server.port:8564
spring.application.name=user-opportunity

eureka.instance.instance-id=${spring.application.name}:${random.value}

#LOCAL
eureka.client.serviceUrl.defaultZone = http://localhost:8555/eureka


#Database related properties
spring.datasource.url=jdbc:mysql://localhost:3306/ms_mybiz_opportunity
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=admin

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update

spring.cloud.loadbalancer.ribbon.enabled=true
#swagger
springdoc.swagger-ui.path=/swagger-url.html
springdoc.api.docs.path=/api-docs

